{{- $config := partial "expo/config.html" . -}}
{{- $items := partialCached "expo/items.html" . .RelPermalink -}}
{{- if $items -}}
{{- .Store.Set "hasExpo" true -}}
<section class="td-expo" data-td-expo data-td-expo-mode="{{ $config.mode }}" data-td-expo-size="{{ $config.size }}" data-td-expo-play-label="{{ T "ui_expo_play" }}" data-td-expo-pause-label="{{ T "ui_expo_pause" }}">
  {{ partial "expo/toolbar.html" (dict "size" $config.size "page" .) }}
  <div class="td-expo-grid" data-td-expo-grid>
  {{ range $items }}
    <figure class="td-expo-item" id="{{ .id }}" data-td-expo-item data-td-expo-width="{{ .width }}" data-td-expo-height="{{ .height }}">
      <a class="td-expo-image" href="{{ .original }}" data-td-expo-image data-td-expo-title="{{ .title }}" data-td-expo-caption="{{ .caption }}" data-td-expo-byline="{{ .byline }}" data-td-expo-poster="{{ .poster }}" data-td-expo-animated="{{ .animated }}" data-td-expo-permalink="{{ .permalink }}" aria-label="{{ .title }} — {{ T "ui_image_zoom_open" }}">
        <picture>{{ if .animated }}<source media="(prefers-reduced-motion: reduce)" srcset="{{ .poster }}">{{ end }}<img src="{{ .src }}" alt="{{ .alt }}"{{ if and .width .height }} width="{{ .width }}" height="{{ .height }}"{{ end }} loading="lazy" decoding="async"></picture>
      </a>
      <figcaption class="td-expo-caption"><h2>{{ .title }}</h2>{{ with .caption }}<p>{{ . }}</p>{{ end }}{{ with .byline }}<small>{{ . }}</small>{{ end }}</figcaption>
    </figure>
  {{ end }}
  </div>
</section>
{{- end -}}
